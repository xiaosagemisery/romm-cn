# Example config file used only for testing
# Refer to examples/config.example.yml for a more detailed config file

exclude:
  platforms:
    - "romm"
  roms:
    single_file:
      names:
        - "info.txt"
      extensions:
        - "xml"

    multi_file:
      names:
        - "my_multi_file_game"
        - "DLC"
      parts:
        names:
          - "data.xml"
        extensions:
          - "txt"
system:
  platforms:
    gc: "ngc"
  versions:
    naomi: "arcade"

filesystem:
  skip_hash_calculation: true
  structure:
    default: "ROMS/{platform}/{game}"
    psx: "ROMS/{platform}/{category}/{game}"
    nes:
      - "ROMS/{platform}/{game}"
      - "ROMS/{platform}/{category}/{game}"

scan:
  priority:
    metadata:
      - "ss" # Screenscraper
      - "launchbox" # Launchbox
    artwork:
      - "igdb" # IGDB
      - "ss" # Screenscraper
    cover:
      - "ss"
      - "tgdb"
    screenshot:
      - "igdb"
    region:
      - jp
      - eu
      - wor
    region_mode: prefer_config
    language:
      - jp
      - es
  media:
    - box2d
    - box3d
    - physical
    - miximage
  gamelist:
    export: true
    media:
      thumbnail: "box3d"
      image: "title_screen"
